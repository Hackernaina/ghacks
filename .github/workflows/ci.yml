name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: reconcile
          POSTGRES_PASSWORD: reconcile
          POSTGRES_DB: reconcile
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reconcile -d reconcile"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgres://reconcile:reconcile@localhost:5432/reconcile_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @reconcile/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm test:int
      - run: pnpm test:mocks
      - run: pnpm --filter @reconcile/frontend build

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f backend/Dockerfile -t reconcile-backend .
      - run: docker build -f backend/dev/stub-psp/Dockerfile -t reconcile-stub-psp .
      - run: docker build -f mocks/Dockerfile -t reconcile-mocks .
      - run: docker build -f frontend/Dockerfile -t reconcile-frontend .
